name: Build Cudy TR3600 OpenWrt Custom Firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Workflow
        uses: actions/checkout@v4

      - name: Free Disk Space & Install Build Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y build-essential libncurses5-dev gawk git subversion libssl-dev gettext unzip zlib1g-dev file python3 python3-pip golang ca-certificates wget rsync flex bison autoconf automake libtool pkg-config

      - name: Clone OpenWrt Source
        run: |
          git clone -b agent/cudy-tr3600-v1-6.12 --single-branch https://github.com/soapmancn/openwrt.git openwrt

      - name: Write feeds.conf.default
        run: |
          cd openwrt
          cat > feeds.conf.default <<'EOF'
src-git packages https://git.openwrt.org/feed/packages.git;openwrt-25.12
src-git luci https://git.openwrt.org/project/luci.git;openwrt-25.12
src-git routing https://git.openwrt.org/feed/routing.git;openwrt-25.12
src-git telephony https://git.openwrt.org/feed/telephony.git;openwrt-25.12
src-git video https://github.com/openwrt/video.git;openwrt-25.12
src-git istore https://github.com/linkease/istore;main
EOF

      - name: Feeds Update & Install
        run: |
          cd openwrt
          ./scripts/feeds clean
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Pull Custom Local Packages
        run: |
          cd openwrt
          mkdir -p package/custom

          # Passwall（移除Passwall2）
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/custom/passwall-packages
          rm -rf feeds/luci/applications/luci-app-passwall
          git clone --depth=1 https://github.com/Openwrt-Passwall/openwrt-passwall.git package/custom/passwall

          # TR3600 Fan Control
          git clone --depth=1 https://github.com/liangcanming/luci-app-tr3600-fan.git package/custom/luci-app-tr3600-fan

          # OpenClash
          rm -rf feeds/luci/applications/luci-app-openclash
          git clone --depth=1 -b master https://github.com/vernesong/OpenClash.git package/custom/openclash

      - name: Set Default Argon Theme
        run: |
          cd openwrt
          sed -i 's|option mediaurlbase.*bootstrap|option mediaurlbase "/luci-static/argon"|g' feeds/luci/modules/luci-base/root/etc/config/luci
          mkdir -p package/base-files/files/etc/uci-defaults
          cat > package/base-files/files/etc/uci-defaults/99-set-argon-theme <<'SHELL'
#!/bin/sh
uci -q get luci.main.theme >/dev/null || {
uci set luci.main.theme='argon'
uci commit luci
}
SHELL
          chmod +x package/base-files/files/etc/uci-defaults/99-set-argon-theme

      - name: Generate .config
        run: |
          cd openwrt
          cat <<'EOF' > .config
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1=y

CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-argon-config=y

CONFIG_PACKAGE_luci-app-store=y

CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y

CONFIG_PACKAGE_luci-app-tr3600-fan=y
CONFIG_PACKAGE_luci-i18n-tr3600-fan-zh-cn=y

CONFIG_PACKAGE_luci-app-openclash=y
CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y

CONFIG_PACKAGE_luci-app-passwall=y
CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
CONFIG_PACKAGE_luci-app-passwall_INCLUDE_SingBox=y

CONFIG_PACKAGE_kmod-mtd-rw=y
CONFIG_PACKAGE_kmod-usb3=y
CONFIG_PACKAGE_kmod-usb-storage=y
CONFIG_PACKAGE_kmod-usb-storage-uas=y
CONFIG_PACKAGE_kmod-usb-ehci=y
CONFIG_PACKAGE_kmod-usb-net=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-net-huawei-cdc-ncm=y
CONFIG_PACKAGE_kmod-usb-net-ipheth=y
CONFIG_PACKAGE_kmod-usb-net-kalmia=y
CONFIG_PACKAGE_kmod-usb-net-rndis=y
CONFIG_PACKAGE_kmod-usb-storage-extras=y
CONFIG_PACKAGE_kmod-usb-wdm=y
CONFIG_PACKAGE_kmod-usb2=y

CONFIG_PACKAGE_luci-app-turboacc-mtk=y
CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y
EOF
          make defconfig
          echo "===== Verify Target & Plugins ====="
          grep 'CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3600-v1' .config
          grep 'luci-app-passwall\|luci-app-openclash\|luci-app-tr3600-fan' .config

      - name: Download Source Files
        run: |
          cd openwrt
          make download -j8

      - name: Compile Firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Check Build Output
        run: |
          cd openwrt
          ls -lh bin/targets/mediatek/filogic/*cudy_tr3600-v1*
          test -n "$(find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*cudy_tr3600-v1*sysupgrade*' -print -quit)"

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cudy-TR3600-Custom-Firmware
          path: |
            openwrt/bin/targets/mediatek/filogic/*cudy_tr3600-v1*
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/profiles.json
          if-no-files-found: error

